<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospector</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340..900;1,9..144,340..900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface-2:#f4f5f8; --border:#d9dce3;
  --fg:#171b24; --muted:#5b6474; --accent:#a3802f; --accent-fg:#3a2c0d;
  --ok:#2f7d52; --warn:#c9821f; --danger:#b23b3b; --info:#3b6ea5;
  --shadow:0 10px 30px -12px rgba(23,27,36,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151c; --surface:#171c26; --surface-2:#1b2130; --border:#2b323f;
    --fg:#e8eaf0; --muted:#8b93a3; --accent:#d2a94e; --accent-fg:#1b1407;
    --ok:#4caf7d; --warn:#d79a3c; --danger:#d16161; --info:#6fa8dc;
    --shadow:0 10px 30px -10px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#171c26; --surface-2:#1b2130; --border:#2b323f;
  --fg:#e8eaf0; --muted:#8b93a3; --accent:#d2a94e; --accent-fg:#1b1407;
  --ok:#4caf7d; --warn:#d79a3c; --danger:#d16161; --info:#6fa8dc;
  --shadow:0 10px 30px -10px rgba(0,0,0,.55);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px; line-height:1.45;
}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif; text-wrap:balance}
a{color:var(--info)}
button{font:inherit}
::selection{background:color-mix(in srgb, var(--accent) 35%, transparent)}
.mono{font-family:'IBM Plex Mono','SF Mono',Consolas,monospace; font-variant-numeric:tabular-nums}
.hidden{display:none!important}

#login-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px 16px;
}
.login-card{
  width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:32px 28px; box-shadow:var(--shadow);
}
.login-brand{display:flex; align-items:baseline; gap:10px; margin-bottom:4px}
.login-brand .mark{
  width:34px; height:34px; border-radius:8px; background:var(--accent); color:var(--accent-fg);
  display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:18px; flex:none;
}
.login-brand h1{font-size:24px; margin:0; font-weight:600}
.login-sub{color:var(--muted); margin:2px 0 22px; font-size:13px}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.field label{font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.02em}
.field input{
  border:1px solid var(--border); background:var(--surface-2); color:var(--fg);
  border-radius:8px; padding:10px 12px; font-size:14px; font-family:inherit;
}
.field input:focus{outline:2px solid var(--accent); outline-offset:1px}
.btn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--fg);
  border-radius:8px; padding:10px 14px; font-weight:600; cursor:pointer; font-size:13.5px;
}
.btn:hover{border-color:color-mix(in srgb, var(--accent) 50%, var(--border))}
.btn:disabled{opacity:.6; cursor:default}
.btn-primary{
  width:auto; background:var(--accent); color:var(--accent-fg); border-color:transparent;
}
.btn-primary:hover{filter:brightness(1.06)}
.login-card .btn-primary{width:100%}
.login-msg{
  font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:14px; line-height:1.4;
}
.login-msg.err{background:color-mix(in srgb, var(--danger) 14%, transparent); color:var(--danger)}
.login-msg.ok{background:color-mix(in srgb, var(--ok) 14%, transparent); color:var(--ok)}

#app-screen{min-height:100vh; display:flex; flex-direction:column}
header.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:8px; flex:none}
.brand .mark{
  width:26px; height:26px; border-radius:6px; background:var(--accent); color:var(--accent-fg);
  display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:13px;
}
.brand span{font-family:'Fraunces',serif; font-weight:600; font-size:17px}
.tabs{display:flex; gap:4px; background:var(--surface-2); border-radius:9px; padding:3px; flex:none; flex-wrap:wrap}
.tab{
  padding:7px 12px; border-radius:7px; font-weight:600; font-size:13px; color:var(--muted);
  cursor:pointer; border:none; background:transparent;
}
.tab.active{background:var(--surface); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search-wrap{flex:1; min-width:160px; max-width:320px}
.search-wrap input{
  width:100%; border:1px solid var(--border); background:var(--surface-2); color:var(--fg);
  border-radius:8px; padding:8px 12px; font-size:13.5px; font-family:inherit;
}
.topbar-right{display:flex; gap:8px; align-items:center; margin-left:auto; flex:none}
.who{font-size:12.5px; color:var(--muted); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.load-error{padding:10px 16px; background:color-mix(in srgb, var(--danger) 14%, transparent); color:var(--danger); font-weight:600; font-size:13px}

main.wrap{flex:1; display:flex; min-width:0}
.rail{
  width:230px; flex:none; border-right:1px solid var(--border); padding:18px 14px;
  display:flex; flex-direction:column; gap:18px; background:var(--surface);
}
.rail-group label{display:block; font-size:11.5px; font-weight:700; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; margin-bottom:8px}
.chip-list{display:flex; flex-direction:column; gap:4px}
.chip{
  border:1px solid transparent; background:transparent; color:var(--fg); text-align:left;
  padding:7px 9px; border-radius:7px; font-size:13px; cursor:pointer; display:flex; justify-content:space-between; gap:8px;
}
.chip:hover{background:var(--surface-2)}
.chip.active{background:var(--surface-2); border-color:var(--border); font-weight:600}
.chip .count{color:var(--muted); font-size:12px}
.stat-block{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px}
.stat-block .big{font-family:'Fraunces',serif; font-size:26px; line-height:1}
.stat-block .cap{color:var(--muted); font-size:12px; margin-top:2px}

.content{flex:1; min-width:0; padding:18px 18px 40px 18px; overflow-x:hidden}
.content-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.content-head h2{margin:0; font-size:20px}
.content-head .sub{color:var(--muted); font-size:12.5px}

.list{display:flex; flex-direction:column; gap:8px}
.row{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; cursor:pointer; display:flex; flex-direction:column; gap:6px;
}
.row:hover{border-color:color-mix(in srgb, var(--accent) 45%, var(--border))}
.row.row-dnc{border-color:color-mix(in srgb, var(--danger) 55%, var(--border)); box-shadow:inset 3px 0 0 var(--danger)}
.row.row-conflict{border-color:color-mix(in srgb, var(--warn) 55%, var(--border)); box-shadow:inset 3px 0 0 var(--warn)}
.row-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.row-name{font-weight:700; font-size:14.5px; min-width:0}
.row-domain{color:var(--muted); font-size:12px; font-family:'IBM Plex Mono',monospace; min-width:0; overflow-wrap:anywhere}
.row-badges{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap}
.row-sub{color:var(--muted); font-size:12.5px; min-width:0; overflow-wrap:anywhere}

.pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
  font-size:11px; font-weight:700; letter-spacing:.01em; white-space:nowrap; line-height:1.4;
}
.pill-muted{background:var(--surface-2); color:var(--muted); border:1px solid var(--border)}
.pill-info{background:color-mix(in srgb, var(--info) 16%, transparent); color:var(--info)}
.pill-ok{background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok)}
.pill-warn{background:color-mix(in srgb, var(--warn) 18%, transparent); color:var(--warn)}
.pill-danger{background:color-mix(in srgb, var(--danger) 16%, transparent); color:var(--danger)}
.pill-accent{background:color-mix(in srgb, var(--accent) 20%, transparent); color:var(--accent)}

.empty{color:var(--muted); font-size:13.5px; padding:30px 0; text-align:center}
.client-group{display:flex; flex-direction:column; gap:8px; margin-bottom:22px}
.client-group-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding-bottom:6px; border-bottom:1px solid var(--border)}
.client-group-title{font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase}
.client-group-blurb{color:var(--muted); font-size:12px}

#backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30; opacity:0; pointer-events:none;
  transition:opacity .18s ease;
}
#backdrop.show{opacity:1; pointer-events:auto}
#drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(480px, 100vw); background:var(--surface);
  border-left:1px solid var(--border); z-index:31; transform:translateX(100%); transition:transform .22s ease;
  display:flex; flex-direction:column; box-shadow:var(--shadow);
}
#drawer.show{transform:translateX(0)}
.drawer-head{
  padding:16px 18px 14px; border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:flex-start;
}
.drawer-head .titles{flex:1; min-width:0}
.drawer-head h3{margin:0 0 4px; font-size:19px; overflow-wrap:anywhere}
.drawer-head a.site-link{font-size:12.5px; word-break:break-all}
.drawer-close{
  border:none; background:var(--surface-2); color:var(--fg); width:28px; height:28px; border-radius:7px;
  cursor:pointer; font-size:15px; flex:none;
}
.drawer-body{flex:1; overflow-y:auto; padding:16px 18px 32px; display:flex; flex-direction:column; gap:20px}
.dsec label.head{display:block; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
.dsec-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.kv{display:flex; flex-direction:column; gap:6px; font-size:13.5px}
.kv .item{display:flex; justify-content:space-between; gap:10px; border-bottom:1px dashed var(--border); padding-bottom:5px}
.kv .item span.v{text-align:right; min-width:0; overflow-wrap:anywhere}
ul.plain{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px}
ul.plain li{font-size:13.5px; padding-left:14px; position:relative}
ul.plain li::before{content:"–"; position:absolute; left:0; color:var(--muted)}
.gap-item{border-left:3px solid var(--border); padding:4px 0 4px 10px; font-size:13.5px}
.gap-item.sev-high{border-color:var(--danger)}
.gap-item.sev-medium{border-color:var(--warn)}
.gap-item.sev-low{border-color:var(--muted)}
.gap-item .t{font-weight:600; display:block}
.stack{display:flex; flex-direction:column; gap:8px}
.person{border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px}
.person .n{font-weight:700}
.person .r{color:var(--muted)}
.person .h{margin-top:3px; font-style:italic; color:var(--muted); font-size:12.5px}
textarea, select{
  width:100%; border:1px solid var(--border); background:var(--surface-2); color:var(--fg);
  border-radius:8px; padding:9px 10px; font-size:13.5px; font-family:inherit; resize:vertical;
}
select{appearance:none}
.save-row{display:flex; gap:8px; align-items:center; justify-content:space-between}
.save-msg{font-size:12.5px; min-height:1.2em}
.save-msg.ok{color:var(--ok)}
.save-msg.err{color:var(--danger)}
.vendor-link{color:var(--info); cursor:pointer; text-decoration:underline; font-weight:600; background:none; border:none; padding:0; font:inherit}
.flag-banner{border-radius:10px; padding:10px 12px; font-size:13.5px; font-weight:700; line-height:1.4}
.flag-banner.dnc{background:color-mix(in srgb, var(--danger) 16%, var(--surface)); color:var(--danger); border:1px solid color-mix(in srgb, var(--danger) 45%, var(--border))}
.flag-banner.conflict{background:color-mix(in srgb, var(--warn) 18%, var(--surface)); color:var(--warn); border:1px solid color-mix(in srgb, var(--warn) 45%, var(--border))}
.work-card{border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px}
.work-card .t{font-weight:700}
.work-card .n{color:var(--muted); margin-top:4px; font-size:12.5px}
.hint{color:var(--muted); font-size:12px; margin-top:6px}

#add-modal{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; align-items:center; justify-content:center; padding:16px}
#add-modal.show{display:flex}
.modal-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:22px; width:100%; max-width:420px; box-shadow:var(--shadow); max-height:90vh; overflow-y:auto}
.modal-card h3{margin:0 0 14px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

@media (max-width:860px){
  .rail{display:none}
  #mobile-filters{display:flex!important}
  .row-badges{width:100%; margin-left:0}
  .who{display:none}
}
#mobile-filters{display:none; gap:6px; padding:10px 16px; overflow-x:auto; background:var(--surface); border-bottom:1px solid var(--border)}
#mobile-filters select{width:auto; flex:none; max-width:240px}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-brand"><div class="mark">P</div><h1>Prospector</h1></div>
    <p class="login-sub">The lead desk. Sign in to open it.</p>
    <div id="login-msg"></div>
    <form id="login-form">
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
    </form>
  </div>
</div>

<div id="app-screen" class="hidden">
  <header class="topbar">
    <div class="brand"><div class="mark">P</div><span>Prospector</span></div>
    <div class="tabs">
      <button class="tab" data-tab="clients" id="tab-clients">Clients</button>
      <button class="tab active" data-tab="conversion" id="tab-conversion">Conversion</button>
      <button class="tab" data-tab="prospects" id="tab-prospects">Prospects</button>
      <button class="tab" data-tab="partners" id="tab-partners">Partners</button>
    </div>
    <div class="search-wrap"><input id="search" type="search" placeholder="Search conversion…"></div>
    <div class="topbar-right">
      <button class="btn" id="add-lead-btn" type="button">+ Add lead</button>
      <span class="who" id="who"></span>
      <button class="btn" id="signout-btn" type="button">Sign out</button>
    </div>
  </header>
  <div id="load-error" class="load-error hidden"></div>
  <div id="mobile-filters"></div>

  <main class="wrap">
    <nav class="rail" id="rail">
      <div class="stat-block">
        <div class="big mono" id="stat-total">0</div>
        <div class="cap" id="stat-cap">organizations</div>
      </div>
      <div id="rail-filters"></div>
    </nav>

    <section class="content hidden" id="clients-view">
      <div class="content-head">
        <h2>Clients</h2>
        <span class="sub" id="clients-count-sub"></span>
      </div>
      <div class="list" id="clients-list"></div>
    </section>

    <section class="content" id="conversion-view">
      <div class="content-head">
        <h2>Conversion</h2>
        <span class="sub" id="conversion-count-sub"></span>
      </div>
      <div class="list" id="conversion-list"><div class="empty">Loading…</div></div>
    </section>

    <section class="content hidden" id="prospects-view">
      <div class="content-head">
        <h2>Prospects</h2>
        <span class="sub" id="prospects-count-sub"></span>
      </div>
      <div class="list" id="prospects-list"></div>
    </section>

    <section class="content hidden" id="partners-view">
      <div class="content-head">
        <h2>Partners</h2>
        <span class="sub" id="partners-count-sub"></span>
      </div>
      <div class="list" id="partners-list"></div>
    </section>
  </main>
</div>

<div id="backdrop"></div>
<aside id="drawer">
  <div class="drawer-head">
    <div class="titles">
      <h3 id="d-name">—</h3>
      <a id="d-site" class="site-link" href="#" target="_blank" rel="noopener"></a>
    </div>
    <button class="drawer-close" id="drawer-close" type="button" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body" id="d-body"></div>
</aside>

<div id="add-modal">
  <div class="modal-card">
    <h3>Add a lead</h3>
    <form id="add-form">
      <div class="field">
        <label for="af-domain">Domain *</label>
        <input id="af-domain" required placeholder="example.com">
      </div>
      <div class="field">
        <label for="af-name">Name *</label>
        <input id="af-name" required placeholder="Practice or firm name">
      </div>
      <div class="grid2">
        <div class="field">
          <label for="af-type">Type</label>
          <select id="af-type">
            <option value="practice_dental">Dental</option>
            <option value="practice_medical">Medical</option>
            <option value="practice_medspa">Medspa</option>
            <option value="practice_vision">Vision</option>
            <option value="practice_legal">Legal</option>
            <option value="agency">Agency</option>
          </select>
        </div>
        <div class="field">
          <label for="af-front">Front</label>
          <select id="af-front">
            <option value="">—</option>
            <option value="direct">Direct</option>
            <option value="partner">Partner</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="af-website">Website</label>
        <input id="af-website" placeholder="https://…">
      </div>
      <div class="field">
        <label for="af-notes">Notes</label>
        <textarea id="af-notes" rows="3"></textarea>
      </div>
      <div class="save-row">
        <button type="button" class="btn" id="af-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="af-submit">Add</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  var REL_PILL = {prospect:"info", past_partner_practice:"accent", direct_client:"ok", past_direct_client:"muted", prospect_partner:"info", active_partner:"ok", past_partner:"muted", not_a_fit:"danger"};
  var SPEND_PILL = {high:"warn", medium:"accent", low:"muted", none:"muted", unknown:"muted"};
  var CLIENT_GROUPS = [
    {key:"direct_client", heading:"Direct clients", blurb:"Signed direct — the DNA Practice offer."},
    {key:"past_direct_client", heading:"Past direct clients", blurb:"Direct work that's finished, kept on the desk."}
  ];
  var PARTNER_GROUPS = [
    {key:"active_partner", heading:"Active partners", blurb:"Agencies the work runs through now."},
    {key:"prospect_partner", heading:"Prospect partners", blurb:"Agencies to approach about white-label work."},
    {key:"past_partner", heading:"Past partners", blurb:"Agencies the work used to come through."},
    {key:"not_a_fit", heading:"Not a fit", blurb:"Reviewed and set aside."}
  ];
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  var state = {
    orgs:[], byDomain:{}, campaigns:{},
    tab:"conversion", search:"",
    filterRel:"all", filterStage:"all", filterVertical:"all",
    filterSpend:"all", filterPartner:"all", filterFlag:"all",
    activeDomain:null, flash:null, loaded:false, loadError:"", pendingDomain:null, booted:false
  };

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }
  function pill(text, cls){ return '<span class="pill pill-'+(cls||"muted")+'">'+esc(text)+'</span>'; }
  function humanize(s){ return String(s||"").replace(/_/g, " "); }
  function typeLabel(v){ return TYPE_LABEL[v] || humanize(v); }
  function stageLabel(s){ return humanize(s || "new"); }
  function asArray(v){
    if(Array.isArray(v)) return v;
    if(typeof v === "string"){
      try { var p = JSON.parse(v); if(Array.isArray(p)) return p; } catch(e){}
    }
    return [];
  }
  function todayISO(){
    var d = new Date();
    function p(n){ return (n<10?"0":"") + n; }
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  }
  function formatDate(iso){
    if(!iso) return "";
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(!m) return String(iso);
    return MONTHS[Number(m[2])-1] + " " + Number(m[3]) + ", " + m[1];
  }
  function dncDate(o){ return o.do_not_contact_until ? String(o.do_not_contact_until).slice(0,10) : ""; }
  function dncActive(o){ var d = dncDate(o); return !!d && d >= todayISO(); }
  function siteHref(site){
    if(!site) return "";
    var s = String(site).trim();
    if(!s || /^javascript:/i.test(s)) return "";
    if(/^https?:\/\//i.test(s)) return s;
    return "https://" + s;
  }
  function legacyType(o){
    if(o.kind === "agency") return "agency";
    if(o.vertical) return "practice_" + o.vertical;
    return "";
  }
  function bucket(o){
    if(o.relationship === "direct_client" || o.relationship === "past_direct_client") return "clients";
    if(o.relationship === "past_partner_practice") return "conversion";
    if(o.kind === "agency" || o.relationship === "prospect_partner" || o.relationship === "active_partner" || o.relationship === "past_partner" || o.relationship === "not_a_fit") return "partners";
    return "prospects";
  }
  function partnerName(domain){
    if(!domain) return "";
    var o = state.byDomain[domain];
    return (o && o.name) || domain;
  }
  function latestAudit(o){
    var list = o.audits || [];
    if(!list.length) return null;
    var best = list[0], i, key = function(a){ return (a.checked_on || "") + " " + (a.created_at || ""); };
    for(i=1;i<list.length;i++){ if(key(list[i]) > key(best)) best = list[i]; }
    return best;
  }
  function conversionPartnerKey(o){
    var jobs = (o.work || []).filter(function(w){ return w.served_via; });
    if(!jobs.length) return "";
    jobs.sort(function(a,b){ return String(b.shot_on||b.created_at||"").localeCompare(String(a.shot_on||a.created_at||"")); });
    return jobs[0].served_via;
  }
  function partnerLabels(o){
    var seen = {}, out = [];
    (o.work || []).forEach(function(w){
      if(!w.served_via || seen[w.served_via]) return;
      seen[w.served_via] = true;
      out.push(partnerName(w.served_via));
    });
    return out;
  }
  function sortOrg(a,b){
    var da = dncActive(a) ? 1 : 0, db = dncActive(b) ? 1 : 0;
    if(da !== db) return da - db;
    return (a.name||"").localeCompare(b.name||"");
  }
  function sortWork(a,b){
    return String(b.shot_on||b.created_at||"").localeCompare(String(a.shot_on||a.created_at||""));
  }

  if(!window.supabase){
    $("login-msg").innerHTML = '<div class="login-msg err">Couldn’t load the database client. Check the network and reload.</div>';
    return;
  }
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  $("login-form").addEventListener("submit", function(e){
    e.preventDefault();
    var email = $("login-email").value.trim();
    var password = $("login-password").value;
    var btn = $("login-submit");
    $("login-msg").innerHTML = "";
    btn.disabled = true;
    db.auth.signInWithPassword({email:email, password:password}).then(function(res){
      btn.disabled = false;
      if(res.error){
        $("login-msg").innerHTML = '<div class="login-msg err">'+esc(res.error.message)+'</div>';
        return;
      }
      boot(res.data.session);
    }, function(err){
      btn.disabled = false;
      $("login-msg").innerHTML = '<div class="login-msg err">'+esc(err && err.message ? err.message : "Sign-in failed")+'</div>';
    });
  });

  $("signout-btn").addEventListener("click", function(){
    db.auth.signOut().then(function(){ location.reload(); });
  });

  db.auth.getSession().then(function(res){
    if(res.data.session) boot(res.data.session);
  });

  function boot(session){
    if(state.booted || !session) return;
    state.booted = true;
    $("login-screen").classList.add("hidden");
    $("app-screen").classList.remove("hidden");
    $("who").textContent = session.user.email || "";
    loadAll();
  }

  function loadAll(){
    var names = ["organizations","contacts","locations","site_audits","past_work","activities","campaigns"];
    var queries = {
      organizations: db.from("organizations").select("*").order("name", {ascending:true}).limit(2000),
      contacts: db.from("contacts").select("*").limit(5000),
      locations: db.from("locations").select("*").limit(5000),
      site_audits: db.from("site_audits").select("*").limit(5000),
      past_work: db.from("past_work").select("*").limit(2000),
      activities: db.from("activities").select("*").order("occurred_at", {ascending:false}).limit(3000),
      campaigns: db.from("campaigns").select("id,name,track,front").limit(200)
    };
    return Promise.all(names.map(function(n){ return queries[n]; })).then(function(results){
      var data = {}, err = "";
      names.forEach(function(n, i){
        if(results[i].error && !err) err = results[i].error.message;
        data[n] = results[i].data || [];
      });
      state.loaded = true;
      if(err){
        state.loadError = err;
        $("load-error").textContent = err;
        $("load-error").classList.remove("hidden");
        render();
        return;
      }
      state.loadError = "";
      $("load-error").classList.add("hidden");
      indexData(data);
      render();
      if(state.pendingDomain && state.byDomain[state.pendingDomain]) openDrawer(state.pendingDomain);
      state.pendingDomain = null;
    }, function(err){
      state.loaded = true;
      state.loadError = err && err.message ? err.message : "Couldn't load the desk.";
      $("load-error").textContent = state.loadError;
      $("load-error").classList.remove("hidden");
      render();
    });
  }

  function indexData(data){
    var by = {};
    state.campaigns = {};
    (data.campaigns || []).forEach(function(c){ state.campaigns[c.id] = c; });
    state.orgs = data.organizations || [];
    state.orgs.forEach(function(o){
      o.contacts = [];
      o.locations = [];
      o.audits = [];
      o.work = [];
      o.activities = [];
      by[o.domain] = o;
    });
    (data.contacts || []).forEach(function(c){ if(by[c.org_domain]) by[c.org_domain].contacts.push(c); });
    (data.locations || []).forEach(function(l){ if(by[l.org_domain]) by[l.org_domain].locations.push(l); });
    (data.site_audits || []).forEach(function(a){ if(by[a.org_domain]) by[a.org_domain].audits.push(a); });
    (data.past_work || []).forEach(function(w){ if(by[w.practice_domain]) by[w.practice_domain].work.push(w); });
    (data.activities || []).forEach(function(a){ if(by[a.org_domain]) by[a.org_domain].activities.push(a); });
    state.orgs.forEach(function(o){
      o.contacts.sort(function(a,b){
        function rank(c){ return c.is_poc ? 0 : (c.is_generic_inbox ? 2 : 1); }
        var d = rank(a) - rank(b);
        if(d) return d;
        return (a.name||a.email||"").localeCompare(b.name||b.email||"");
      });
      o.work.sort(sortWork);
    });
    state.byDomain = by;
  }

  document.querySelector(".tabs").addEventListener("click", function(e){
    var t = e.target.closest(".tab");
    if(!t) return;
    switchTab(t.dataset.tab);
  });

  function switchTab(tab){
    if(!tab || state.tab === tab) return;
    state.tab = tab;
    state.filterRel = "all";
    state.filterStage = "all";
    state.filterVertical = "all";
    state.filterSpend = "all";
    state.filterPartner = "all";
    state.filterFlag = "all";
    render();
  }

  function paintTabs(){
    TABS.forEach(function(t){
      var n = state.orgs.filter(function(o){ return bucket(o) === t.id; }).length;
      var btn = $("tab-"+t.id);
      btn.textContent = state.loaded ? (t.label + " · " + n) : t.label;
      btn.dataset.count = String(n);
      btn.classList.toggle("active", state.tab === t.id);
      $(t.id+"-view").classList.toggle("hidden", state.tab !== t.id);
    });
    $("search").placeholder = SEARCH_PH[state.tab] || "Search…";
    $("stat-total").textContent = String(state.orgs.length);
    $("stat-cap").textContent = "organizations";
  }

  function countBy(rows, fn){
    var counts = {};
    rows.forEach(function(o){
      var k = fn(o);
      if(k == null || k === "") k = "unset";
      counts[k] = (counts[k] || 0) + 1;
    });
    return counts;
  }

  function filterGroups(tab, rows){
    if(tab === "clients"){
      return [chipGroup("Relationship", "filterRel", countBy(rows, function(o){ return o.relationship; }), REL_LABEL, ["direct_client","past_direct_client"])];
    }
    if(tab === "conversion"){
      var partnerCounts = countBy(rows, function(o){ return conversionPartnerKey(o) || "unset"; });
      var partnerLabels = {unset:"No partner on file"};
      Object.keys(partnerCounts).forEach(function(k){ if(k !== "unset") partnerLabels[k] = partnerName(k); });
      return [
        chipGroup("Served via", "filterPartner", partnerCounts, partnerLabels, null),
        chipGroup("Stage", "filterStage", countBy(rows, function(o){ return o.stage || "new"; }), null, STAGE_OPTS),
        chipGroup("Flags", "filterFlag", flagCounts(rows), {dnc:"Do not contact", conflict:"Partner conflict", clear:"Clear"}, ["dnc","conflict","clear"])
      ];
    }
    if(tab === "prospects"){
      return [
        chipGroup("Type", "filterVertical", countBy(rows, function(o){ return o.vertical || "unset"; }), TYPE_LABEL, VERTICAL_OPTS.concat(["unset"])),
        chipGroup("Stage", "filterStage", countBy(rows, function(o){ return o.stage || "new"; }), null, STAGE_OPTS),
        chipGroup("Ad spend", "filterSpend", countBy(rows, function(o){ return (latestAudit(o) || {}).spend_signal || "unknown"; }), null, ["high","medium","low","none","unknown"])
      ];
    }
    return [
      chipGroup("Relationship", "filterRel", countBy(rows, function(o){ return o.relationship; }), REL_LABEL, AGENCY_RELS),
      chipGroup("Stage", "filterStage", countBy(rows, function(o){ return o.stage || "new"; }), null, STAGE_OPTS)
    ];
  }

  function flagCounts(rows){
    var c = {dnc:0, conflict:0, clear:0};
    rows.forEach(function(o){
      var d = dncActive(o), k = !!o.partner_conflict;
      if(d) c.dnc++;
      if(k) c.conflict++;
      if(!d && !k) c.clear++;
    });
    return c;
  }

  function chipGroup(title, key, counts, labelMap, order){
    var keys = order ? order.filter(function(k){ return counts[k]; }) : Object.keys(counts).sort(function(a,b){
      if(counts[b] !== counts[a]) return counts[b] - counts[a];
      return String(labelOf(a, labelMap)).localeCompare(String(labelOf(b, labelMap)));
    });
    return {title:title, key:key, counts:counts, labelMap:labelMap, keys:keys};
  }
  function labelOf(k, labelMap){
    if(labelMap && labelMap[k]) return labelMap[k];
    if(k === "unset") return "Unset";
    return stageLabel(k).replace(/^./, function(c){ return c.toUpperCase(); });
  }

  function renderFilters(){
    var rows = state.orgs.filter(function(o){ return bucket(o) === state.tab; });
    var groups = state.loaded ? filterGroups(state.tab, rows) : [];
    $("rail-filters").innerHTML = groups.map(function(g){
      var html = '<div class="rail-group"><label>'+esc(g.title)+'</label><div class="chip-list">';
      html += chipHtml("all", "All", rows.length, state[g.key], g.key);
      g.keys.forEach(function(k){
        html += chipHtml(k, labelOf(k, g.labelMap), g.counts[k], state[g.key], g.key);
      });
      html += '</div></div>';
      return html;
    }).join("");
    var box = $("mobile-filters");
    box.innerHTML = "";
    groups.slice(0, 3).forEach(function(g){
      var sel = document.createElement("select");
      sel.setAttribute("aria-label", g.title);
      var all = document.createElement("option");
      all.value = "all";
      all.textContent = g.title + ": all";
      sel.appendChild(all);
      g.keys.forEach(function(k){
        var opt = document.createElement("option");
        opt.value = k;
        opt.textContent = labelOf(k, g.labelMap) + " (" + g.counts[k] + ")";
        sel.appendChild(opt);
      });
      sel.value = state[g.key] || "all";
      sel.addEventListener("change", function(){
        state[g.key] = sel.value;
        renderLists();
        renderFilters();
      });
      box.appendChild(sel);
    });
  }
  function chipHtml(val, label, count, active, key){
    return '<button type="button" class="chip'+(active===val?" active":"")+'" data-val="'+esc(val)+'" data-key="'+esc(key)+'">'+esc(label)+'<span class="count">'+count+'</span></button>';
  }

  $("rail-filters").addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if(!chip) return;
    state[chip.dataset.key] = chip.dataset.val;
    render();
  });

  $("search").addEventListener("input", function(){
    state.search = this.value.trim().toLowerCase();
    renderLists();
  });

  function hay(o){
    var parts = [o.domain, o.name, o.city, o.region, o.summary, o.notes, o.next_action, o.specialty, o.vertical, o.kind, o.relationship, o.stage, o.web_vendor, o.vendor_note, legacyType(o)];
    (o.contacts||[]).forEach(function(c){ parts.push(c.name, c.email, c.role, c.hook); });
    (o.locations||[]).forEach(function(l){ parts.push(l.label, l.address, l.city, l.region); });
    asArray(o.hooks).forEach(function(h){ parts.push(h); });
    (o.work||[]).forEach(function(w){
      parts.push(w.work_type, w.notes, w.served_via, w.status);
      if(w.served_via) parts.push(partnerName(w.served_via));
    });
    return parts.filter(function(p){ return p != null && p !== ""; }).join(" ").toLowerCase();
  }

  function matches(o){
    if(state.search && hay(o).indexOf(state.search) === -1) return false;
    if(state.tab === "clients" && state.filterRel !== "all" && o.relationship !== state.filterRel) return false;
    if(state.tab === "partners" && state.filterRel !== "all" && o.relationship !== state.filterRel) return false;
    if((state.tab === "conversion" || state.tab === "prospects" || state.tab === "partners") && state.filterStage !== "all" && (o.stage||"new") !== state.filterStage) return false;
    if(state.tab === "prospects" && state.filterVertical !== "all" && (o.vertical||"unset") !== state.filterVertical) return false;
    if(state.tab === "prospects" && state.filterSpend !== "all"){
      var sp = (latestAudit(o) || {}).spend_signal || "unknown";
      if(sp !== state.filterSpend) return false;
    }
    if(state.tab === "conversion" && state.filterPartner !== "all"){
      var key = conversionPartnerKey(o) || "unset";
      if(key !== state.filterPartner) return false;
    }
    if(state.tab === "conversion" && state.filterFlag !== "all"){
      var d = dncActive(o), k = !!o.partner_conflict;
      if(state.filterFlag === "dnc" && !d) return false;
      if(state.filterFlag === "conflict" && !k) return false;
      if(state.filterFlag === "clear" && (d || k)) return false;
    }
    return true;
  }

  function render(){
    paintTabs();
    renderFilters();
    renderLists();
  }

  function subtitle(tab, all, shown){
    if(tab === "clients"){
      var d = all.filter(function(o){ return o.relationship === "direct_client"; }).length;
      var p = all.filter(function(o){ return o.relationship === "past_direct_client"; }).length;
      return d + " direct · " + p + " past direct · " + shown.length + " shown";
    }
    if(tab === "conversion"){
      var dnc = all.filter(dncActive).length;
      return all.length + " past partner practices · " + dnc + " do not contact · " + shown.length + " shown";
    }
    if(tab === "prospects"){
      var g = all.filter(function(o){ return o.kind === "practice_group"; }).length;
      return (all.length - g) + " practices · " + g + " groups · " + shown.length + " shown";
    }
    return all.length + " agencies · " + shown.length + " shown";
  }

  function renderLists(){
    var tab = state.tab;
    var all = state.orgs.filter(function(o){ return bucket(o) === tab; });
    var shown = all.filter(matches);
    var sub = $(tab+"-count-sub");
    var list = $(tab+"-list");
    if(!state.loaded){
      if(sub) sub.textContent = "";
      list.innerHTML = '<div class="empty">Loading…</div>';
      return;
    }
    if(sub) sub.textContent = state.loadError ? "" : subtitle(tab, all, shown);
    if(state.loadError){
      list.innerHTML = '<div class="empty">The desk didn’t load.</div>';
      return;
    }
    if(!state.orgs.length){
      list.innerHTML = '<div class="empty">No organizations are visible to this account.</div>';
      return;
    }
    if(!shown.length){
      list.innerHTML = '<div class="empty">Nothing in this tab matches.</div>';
      return;
    }
    list.innerHTML = renderTab(tab, shown);
  }

  function renderTab(tab, rows){
    if(tab === "clients") return renderNamedGroups(rows, CLIENT_GROUPS, function(o){ return o.relationship; });
    if(tab === "partners") return renderNamedGroups(rows, PARTNER_GROUPS, function(o){ return o.relationship; });
    if(tab === "conversion") return renderConversion(rows);
    return renderProspects(rows);
  }

  function groupWrap(title, blurb, rows){
    if(!rows.length) return "";
    return '<div class="client-group"><div class="client-group-head"><span class="client-group-title">'+esc(title)+'</span>'
      + '<span class="client-group-blurb">'+esc(blurb)+'</span></div>'
      + rows.map(orgRow).join("") + '</div>';
  }

  function renderNamedGroups(rows, groups, keyFn){
    var used = {}, html = "";
    groups.forEach(function(g){
      var part = rows.filter(function(o){ return keyFn(o) === g.key; }).sort(sortOrg);
      part.forEach(function(o){ used[o.domain] = true; });
      html += groupWrap(g.heading, g.blurb, part);
    });
    var rest = rows.filter(function(o){ return !used[o.domain]; }).sort(sortOrg);
    html += groupWrap("Other", "Doesn't sit in a named group yet.", rest);
    return html;
  }

  function renderConversion(rows){
    var map = {};
    rows.forEach(function(o){
      var k = conversionPartnerKey(o) || "";
      (map[k] = map[k] || []).push(o);
    });
    var keys = Object.keys(map).sort(function(a,b){
      if(!a) return 1;
      if(!b) return -1;
      if(map[b].length !== map[a].length) return map[b].length - map[a].length;
      return partnerName(a).localeCompare(partnerName(b));
    });
    return keys.map(function(k){
      var list = map[k].slice().sort(sortOrg);
      var heading = k ? partnerName(k) : "No partner on file";
      var blurb = k
        ? (list.length + (list.length===1?" practice":" practices") + " served through this partner")
        : "Past partner practices with no served-via partner";
      return groupWrap(heading, blurb, list);
    }).join("");
  }

  function renderProspects(rows){
    var practices = rows.filter(function(o){ return o.kind !== "practice_group"; }).sort(sortOrg);
    var groups = rows.filter(function(o){ return o.kind === "practice_group"; }).sort(sortOrg);
    return groupWrap("Practices", "Not signed direct yet.", practices)
      + groupWrap("Practice groups", "Multi-site groups still in prospecting.", groups);
  }

  function orgRow(o){
    var cls = "row";
    var sub = rowSub(o);
    if(dncActive(o)) cls += " row-dnc";
    else if(o.partner_conflict) cls += " row-conflict";
    var badges = "";
    if(o.kind === "practice_group") badges += pill("Group", "muted");
    var lt = legacyType(o);
    if(lt) badges += pill(typeLabel(lt), "muted");
    badges += pill(REL_LABEL[o.relationship] || humanize(o.relationship), REL_PILL[o.relationship] || "muted");
    badges += pill(stageLabel(o.stage), STAGE_PILL[o.stage] || "muted");
    var audit = latestAudit(o);
    if(audit && audit.spend_signal && audit.spend_signal !== "unknown"){
      var spendText = audit.spend_signal === "none" ? "no ad spend" : (audit.spend_signal + " spend");
      badges += pill(spendText, SPEND_PILL[audit.spend_signal] || "muted");
    }
    if(dncActive(o)) badges += pill("Do not contact until " + formatDate(dncDate(o)), "danger");
    else if(dncDate(o)) badges += pill("DNC ended " + formatDate(dncDate(o)), "muted");
    if(o.partner_conflict) badges += pill("Partner conflict", "warn");
    var via = partnerLabels(o);
    if(bucket(o) === "conversion" && via.length) badges += pill("via " + via.join(", "), "accent");
    if((o.relationship === "direct_client" || o.relationship === "past_direct_client") && o.client_since){
      badges += pill("since " + formatDate(o.client_since), "info");
    }
    return '<div class="'+cls+'" data-domain="'+esc(o.domain)+'">'
      + '<div class="row-top"><span class="row-name">'+esc(o.name || o.domain)+'</span>'
      + '<span class="row-domain">'+esc(o.domain)+'</span>'
      + '<div class="row-badges">'+badges+'</div></div>'
      + (sub ? '<div class="row-sub">'+sub+'</div>' : '')
      + '</div>';
  }

  function rowSub(o){
    var lines = [];
    var place = [o.city, o.specialty].filter(Boolean).map(esc).join(" · ");
    if(place) lines.push(place);
    (o.work || []).forEach(function(w){
      var bits = [
        w.served_via ? partnerName(w.served_via) : (w.front === "direct" ? "Direct" : ""),
        w.work_type || "",
        w.status ? humanize(w.status) : "",
        w.shot_on ? formatDate(w.shot_on) : ""
      ].filter(Boolean).map(esc);
      if(bits.length) lines.push(bits.join(" · "));
    });
    if(o.next_action) lines.push(esc(o.next_action));
    else if(!(o.work || []).length && o.summary) lines.push(esc(o.summary));
    return lines.join("<br>");
  }

  document.body.addEventListener("click", function(e){
    var jump = e.target.closest("[data-jump]");
    if(jump && jump.dataset.jump){ openDrawer(jump.dataset.jump); return; }
    var row = e.target.closest(".row");
    if(row && row.dataset.domain && !e.target.closest("#drawer")) openDrawer(row.dataset.domain);
  });

  function openDrawer(domain){
    var o = state.byDomain[domain];
    if(!o) return;
    if(state.flash && state.flash.domain !== domain) state.flash = null;
    state.activeDomain = domain;
    $("d-name").textContent = o.name || domain;
    var siteLink = $("d-site");
    var href = siteHref(o.website || o.domain);
    if(href){ siteLink.href = href; siteLink.textContent = o.website || o.domain; siteLink.classList.remove("hidden"); }
    else siteLink.classList.add("hidden");
    $("d-body").innerHTML = drawerHtml(o);
    var save = $("e-save");
    if(save) save.addEventListener("click", function(){ saveOrg(domain); });
    $("backdrop").classList.add("show");
    $("drawer").classList.add("show");
  }

  function closeDrawer(){
    $("backdrop").classList.remove("show");
    $("drawer").classList.remove("show");
    state.activeDomain = null;
  }
  $("drawer-close").addEventListener("click", closeDrawer);
  $("backdrop").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeDrawer(); });

  function selectHtml(id, options, current){
    return '<select id="'+id+'">' + options.map(function(opt){
      return '<option value="'+esc(opt.value)+'"'+(opt.value===current?" selected":"")+'>'+esc(opt.label)+'</option>';
    }).join("") + '</select>';
  }
  function relOptions(o){
    var keys = (o.kind === "agency" ? AGENCY_RELS : PRACTICE_RELS).slice();
    if(o.relationship && keys.indexOf(o.relationship) === -1) keys.unshift(o.relationship);
    return keys.map(function(k){ return {value:k, label: REL_LABEL[k] || humanize(k)}; });
  }
  function stageOptions(o){
    var keys = STAGE_OPTS.slice();
    if(o.stage && keys.indexOf(o.stage) === -1) keys.unshift(o.stage);
    return keys.map(function(k){ return {value:k, label: stageLabel(k)}; });
  }

  function drawerHtml(o){
    var sections = [];
    var dnc = dncDate(o);
    if(dnc && dncActive(o)){
      sections.push('<div class="flag-banner dnc">Do not contact until '+esc(formatDate(dnc))+'.</div>');
    } else if(dnc){
      sections.push('<div class="flag-banner conflict">Do-not-contact window ended '+esc(formatDate(dnc))+'.</div>');
    }
    if(o.partner_conflict){
      sections.push('<div class="flag-banner conflict">Partner conflict. This one is still tied to a partner — check before direct outreach.</div>');
    }

    var flash = (state.flash && state.flash.domain === o.domain) ? state.flash.text : "";
    sections.push(
      '<div class="dsec"><label class="head">Relationship and stage</label>'
      + '<div class="grid2" style="margin-bottom:8px">'
      + selectHtml("e-rel", relOptions(o), o.relationship)
      + selectHtml("e-stage", stageOptions(o), o.stage || "new")
      + '</div>'
      + '<textarea id="e-next" rows="2" placeholder="Next action">'+esc(o.next_action||"")+'</textarea>'
      + '<div style="height:8px"></div>'
      + '<textarea id="e-notes" rows="3" placeholder="Notes">'+esc(o.notes||"")+'</textarea>'
      + '<div style="height:10px"></div>'
      + '<div class="save-row"><span id="e-msg" class="save-msg'+(flash?" ok":"")+'">'+esc(flash)+'</span>'
      + '<button class="btn btn-primary" id="e-save" type="button">Save</button></div>'
      + '<div class="hint">Track follows the relationship automatically ('+esc(o.track || bucket(o))+'). Stage and relationship changes are logged for you.</div>'
      + '</div>'
    );

    if(o.summary) sections.push('<div class="dsec"><label class="head">Summary</label><div style="font-size:13.5px">'+esc(o.summary)+'</div></div>');

    if(o.contacts.length){
      sections.push('<div class="dsec"><label class="head">Contacts</label><div class="stack">'
        + o.contacts.map(contactHtml).join("") + '</div></div>');
    }
    var phones = asArray(o.phones);
    if(phones.length){
      sections.push('<div class="dsec"><label class="head">Phone lines</label><div class="kv">'
        + phones.map(function(p){
          var label = (p && (p.label || p.name)) || "Phone";
          var num = (p && (p.number || p.phone)) || (typeof p === "string" ? p : "");
          return '<div class="item"><span>'+esc(label)+'</span><span class="v mono">'+esc(num)+'</span></div>';
        }).join("") + '</div></div>');
    }

    if(o.locations.length){
      sections.push('<div class="dsec"><label class="head">Locations</label><ul class="plain">'
        + o.locations.map(function(l){
          var bits = [];
          if(l.label) bits.push(l.label);
          if(l.address) bits.push(l.address);
          else if(l.city || l.region) bits.push([l.city, l.region].filter(Boolean).join(", "));
          if(l.phone) bits.push(l.phone);
          return '<li>'+esc(bits.join(" — ") || "Location")+'</li>';
        }).join("") + '</ul></div>');
    }

    if(o.work.length){
      sections.push('<div class="dsec"><label class="head">Past work</label><div class="stack">'
        + o.work.map(workCard).join("") + '</div></div>');
    }

    var audit = latestAudit(o);
    if(audit){
      var gaps = asArray(audit.gaps);
      if(gaps.length){
        sections.push('<div class="dsec"><label class="head">Gaps'+(audit.checked_on ? " · "+esc(formatDate(audit.checked_on)) : "")+'</label>'
          + gaps.map(function(g){
            var sev = (g && (g.severity === "high" || g.severity === "medium" || g.severity === "low")) ? g.severity : "low";
            var title = typeof g === "string" ? g : (g.title || g.type || "Gap");
            var detail = (g && typeof g === "object") ? (g.detail || "") : "";
            return '<div class="gap-item sev-'+sev+'"><span class="t">'+esc(title)+'</span>'+esc(detail)+'</div>';
          }).join("") + '</div>');
      }
      sections.push(auditHtml(o, audit));
    }

    var hooks = asArray(o.hooks);
    if(hooks.length){
      sections.push('<div class="dsec"><label class="head">Hooks</label><ul class="plain">'
        + hooks.map(function(h){ return '<li>'+esc(h)+'</li>'; }).join("") + '</ul></div>');
    }

    if(o.web_vendor || o.vendor_platform || o.vendor_evidence || o.vendor_note){
      var vname = o.web_vendor ? partnerName(o.web_vendor) : "";
      var nameHtml = (o.web_vendor && state.byDomain[o.web_vendor])
        ? '<button type="button" class="vendor-link" data-jump="'+esc(o.web_vendor)+'">'+esc(vname)+'</button>'
        : esc(vname || o.vendor_note || "");
      sections.push('<div class="dsec"><label class="head">Site vendor</label><div class="kv">'
        + (vname || o.vendor_note ? '<div class="item"><span>Name</span><span class="v">'+nameHtml+'</span></div>' : '')
        + (o.vendor_platform ? '<div class="item"><span>Platform</span><span class="v">'+esc(o.vendor_platform)+'</span></div>' : '')
        + (o.vendor_evidence ? '<div class="item"><span>Evidence</span><span class="v">'+esc(o.vendor_evidence)+'</span></div>' : '')
        + (o.vendor_note && o.web_vendor ? '<div class="item"><span>Note</span><span class="v">'+esc(o.vendor_note)+'</span></div>' : '')
        + '</div></div>');
    }

    var services = asArray(o.services);
    if(services.length){
      sections.push('<div class="dsec"><label class="head">Services</label><div class="dsec-row">'
        + services.map(function(s){ return pill(s, "muted"); }).join("") + '</div></div>');
    }

    var profile = agencyProfile(o);
    if(profile) sections.push(profile);

    var meta = metaItems(o);
    if(meta.length){
      sections.push('<div class="dsec"><label class="head">Details</label><div class="kv">'+meta.join("")+'</div></div>');
    }

    if(o.plan || o.mrr_cents != null || o.stripe_customer_id){
      var mrr = o.mrr_cents == null ? "" : ("$" + (o.mrr_cents / 100).toFixed(2) + " / mo");
      sections.push('<div class="dsec"><label class="head">Billing</label><div class="kv">'
        + (o.plan ? '<div class="item"><span>Plan</span><span class="v">'+esc(o.plan)+'</span></div>' : '')
        + (mrr ? '<div class="item"><span>MRR</span><span class="v mono">'+esc(mrr)+'</span></div>' : '')
        + (o.stripe_customer_id ? '<div class="item"><span>Stripe</span><span class="v mono">'+esc(o.stripe_customer_id)+'</span></div>' : '')
        + '</div></div>');
    }

    if(o.activities.length){
      sections.push('<div class="dsec"><label class="head">Recent activity</label><ul class="plain">'
        + o.activities.slice(0, 8).map(function(a){
          var change = (a.from_value || a.to_value) ? (" "+esc(a.from_value||"—")+" → "+esc(a.to_value||"—")) : "";
          return '<li><span class="mono">'+esc(formatDate(a.occurred_at))+'</span> · '+esc(humanize(a.kind))+change
            + (a.summary ? " — "+esc(a.summary) : "") + '</li>';
        }).join("") + '</ul></div>');
    }

    return sections.join("");
  }

  function contactHtml(c){
    var tags = "";
    if(c.is_poc) tags += " " + pill("POC", "ok");
    if(c.is_generic_inbox) tags += " " + pill("inbox", "muted");
    return '<div class="person"><span class="n">'+esc(c.name || c.email || "Contact")+'</span>'
      + (c.role ? ' <span class="r">— '+esc(c.role)+'</span>' : '')
      + tags
      + (c.email ? '<div class="mono" style="font-size:12px;margin-top:3px">'+esc(c.email)+'</div>' : '')
      + (c.phone ? '<div class="mono" style="font-size:12px">'+esc(c.phone)+'</div>' : '')
      + (c.hook ? '<div class="h">'+esc(c.hook)+'</div>' : '')
      + '</div>';
  }

  function workCard(w){
    var who = w.served_via ? partnerName(w.served_via) : "Direct";
    var whoHtml = (w.served_via && state.byDomain[w.served_via])
      ? '<button type="button" class="vendor-link" data-jump="'+esc(w.served_via)+'">'+esc(who)+'</button>'
      : esc(who);
    var bits = [w.front ? humanize(w.front) : "", w.work_type || "", w.status ? humanize(w.status) : "", w.shot_on ? formatDate(w.shot_on) : ""].filter(Boolean);
    var links = "";
    if(siteHref(w.gallery_url)) links += ' <a href="'+esc(siteHref(w.gallery_url))+'" target="_blank" rel="noopener">Gallery</a>';
    if(siteHref(w.review_url)) links += ' <a href="'+esc(siteHref(w.review_url))+'" target="_blank" rel="noopener">Review</a>';
    return '<div class="work-card"><div class="t">'+whoHtml+'</div>'
      + (bits.length ? '<div>'+esc(bits.join(" · "))+links+'</div>' : (links ? '<div>'+links+'</div>' : ''))
      + (w.notes ? '<div class="n">'+esc(w.notes)+'</div>' : '')
      + '</div>';
  }

  function auditHtml(o, audit){
    var tags = "";
    if(audit.spend_signal) tags += pill("spend: "+audit.spend_signal, SPEND_PILL[audit.spend_signal] || "muted");
    if(audit.google_ads) tags += pill("google: "+audit.google_ads, "muted");
    if(audit.meta_ads) tags += pill("meta: "+audit.meta_ads, "muted");
    if(audit.bing_ads) tags += pill("bing: "+audit.bing_ads, "muted");
    if(audit.other_ads) tags += pill("other: "+audit.other_ads, "muted");
    if(audit.call_tracking) tags += pill("calls: "+audit.call_tracking, "muted");
    asArray(audit.tracking_tags).forEach(function(t){ tags += pill(t, "muted"); });
    var extra = "";
    if(o.audits.length > 1) extra += '<div class="hint">'+(o.audits.length-1)+' earlier audit'+(o.audits.length===2?"":"s")+' on file. Showing the latest.</div>';
    return '<div class="dsec"><label class="head">Audit'+(audit.checked_on ? " · "+esc(formatDate(audit.checked_on)) : "")+'</label>'
      + (tags ? '<div class="dsec-row" style="margin-bottom:8px">'+tags+'</div>' : '')
      + (audit.live_ads ? '<div style="font-size:12.5px;color:var(--muted)">'+esc(audit.live_ads)+'</div>' : '')
      + (audit.evidence ? '<div class="hint">'+esc(audit.evidence)+'</div>' : '')
      + extra
      + '</div>';
  }

  function agencyProfile(o){
    var serves = asArray(o.serves);
    var states = asArray(o.states);
    if(!serves.length && !states.length && !o.stance && !o.video_inhouse && !o.video_note && !o.state_count) return "";
    var html = '<div class="dsec"><label class="head">Partner profile</label>';
    if(serves.length) html += '<div class="dsec-row" style="margin-bottom:8px">'+serves.map(function(s){ return pill(s,"muted"); }).join("")+'</div>';
    html += '<div class="kv">';
    if(o.stance) html += '<div class="item"><span>Stance</span><span class="v">'+esc(o.stance)+'</span></div>';
    if(o.video_inhouse) html += '<div class="item"><span>Video in house</span><span class="v">'+esc(o.video_inhouse)+'</span></div>';
    if(o.state_count != null) html += '<div class="item"><span>States</span><span class="v">'+esc(o.state_count)+'</span></div>';
    if(states.length) html += '<div class="item"><span>Confirmed</span><span class="v">'+esc(states.join(", "))+'</span></div>';
    html += '</div>';
    if(o.video_note) html += '<div class="hint">'+esc(o.video_note)+'</div>';
    html += '</div>';
    return html;
  }

  function metaItems(o){
    var items = [];
    function add(k, v){ if(v != null && v !== "") items.push('<div class="item"><span>'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>'); }
    add("Kind", o.kind === "practice_group" ? "Practice group" : humanize(o.kind));
    if(o.vertical) add("Type", typeLabel(legacyType(o)));
    add("Specialty", o.specialty);
    add("Target front", o.target_front);
    add("Priority", o.priority);
    if(o.client_since) add("Client since", formatDate(o.client_since));
    if(o.date_found) add("Found", formatDate(o.date_found));
    add("Locations", o.location_count);
    add("Providers", o.provider_count);
    add("Size", o.size_note);
    if(o.city) add("City", o.city);
    if(o.region && (!o.city || o.city.indexOf(o.region) === -1)) add("Region", o.region);
    if(o.hours) add("Hours", o.hours);
    if(o.insurance) add("Insurance", o.insurance);
    if(o.campaign_id && state.campaigns[o.campaign_id]) add("Campaign", state.campaigns[o.campaign_id].name);
    if(o.parent_group) add("Parent", partnerName(o.parent_group));
    if(o.booking_url) add("Booking", o.booking_url);
    return items;
  }

  function saveOrg(domain){
    var o = state.byDomain[domain];
    if(!o) return;
    var relationship = $("e-rel").value;
    var stage = $("e-stage").value;
    var nextAction = $("e-next").value.trim();
    var notes = $("e-notes").value.trim();
    var btn = $("e-save");
    var msg = $("e-msg");
    btn.disabled = true;
    btn.textContent = "Saving…";
    msg.className = "save-msg";
    msg.textContent = "";
    db.from("organizations").update({
      relationship: relationship,
      stage: stage,
      next_action: nextAction || null,
      notes: notes || null
    }).eq("domain", domain).select().then(function(res){
      if(res.error || !res.data || !res.data[0]){
        btn.disabled = false;
        btn.textContent = "Save";
        msg.className = "save-msg err";
        msg.textContent = (res.error && res.error.message) || "Save didn't change a row.";
        return;
      }
      var updated = res.data[0];
      var before = bucket(o);
      Object.keys(updated).forEach(function(k){ o[k] = updated[k]; });
      var after = bucket(o);
      state.flash = {
        domain: domain,
        text: before === after ? "Saved." : ("Saved. Now listed under " + TAB_TITLE[after] + ".")
      };
      render();
      db.from("activities").select("*").eq("org_domain", domain).order("occurred_at", {ascending:false}).limit(20).then(function(act){
        if(act && act.data) o.activities = act.data;
        openDrawer(domain);
      }, function(){ openDrawer(domain); });
    }, function(err){
      btn.disabled = false;
      btn.textContent = "Save";
      msg.className = "save-msg err";
      msg.textContent = err && err.message ? err.message : "Couldn't save.";
    });
  }

  $("add-lead-btn").addEventListener("click", function(){ $("add-modal").classList.add("show"); });
  $("af-cancel").addEventListener("click", function(){ $("add-modal").classList.remove("show"); $("add-form").reset(); });
  $("add-form").addEventListener("submit", function(e){
    e.preventDefault();
    var domain = $("af-domain").value.trim().toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/\/.*$/,"").replace(/\.$/,"");
    var name = $("af-name").value.trim();
    var type = $("af-type").value;
    var front = $("af-front").value || null;
    var website = $("af-website").value.trim();
    var notes = $("af-notes").value.trim();
    if(!domain || !name) return;
    var payload = {
      doc_id: domain,
      name: name,
      type: type,
      website: website || ("https://" + domain),
      notes: notes,
      front: front,
      data: {
        practice_name: name,
        website: website || ("https://" + domain),
        notes: notes,
        type: type,
        front: front || "",
        date_found: todayISO()
      }
    };
    var btn = $("af-submit");
    btn.disabled = true;
    btn.textContent = "Adding…";
    db.rpc("capture_lead", {payload: payload}).then(function(res){
      btn.disabled = false;
      btn.textContent = "Add";
      if(res.error){ alert("Couldn't add lead: " + res.error.message); return; }
      var savedDomain = (typeof res.data === "string" && res.data) || domain;
      state.pendingDomain = savedDomain;
      state.tab = type === "agency" ? "partners" : "prospects";
      $("add-modal").classList.remove("show");
      $("add-form").reset();
      loadAll();
    }, function(err){
      btn.disabled = false;
      btn.textContent = "Add";
      alert("Couldn't add lead: " + (err && err.message ? err.message : "request failed"));
    });
  });
})();
</script>
</body>
</html>
